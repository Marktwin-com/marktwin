name: Feature request
description: Suggest an improvement to Marktwin.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Marktwin do differently?
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Privacy impact
      options:
        - No private data should reach the server
        - This may touch the privacy boundary
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
